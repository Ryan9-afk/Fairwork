# Netlify Configuration for Fairwork Pulse (Next.js 16)
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build:next"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
  # These values are intentionally public and must be embedded in the browser bundle.
  # Keep secret scanning enabled for server-only credentials such as DEEPSEEK_API_KEY.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
  # Turbopack caches server environment values during compilation. This cache is not
  # published, so omit it while continuing to scan source and deployable output.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**"

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

# Cache static assets immutably
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
